services:
  - type: web
    name: bist-tarayici
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180"
    healthCheckPath: /
    envVars:
      - key: RENDER
        value: "1"
      - key: BIST_SKIP_BOOTSTRAP
        value: "0"
